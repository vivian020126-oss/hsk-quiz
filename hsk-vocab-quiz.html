<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK词汇互动测验游戏</title>
<style>
:root {
  --primary: #e74c3c;
  --primary-light: #ff6b6b;
  --success: #27ae60;
  --success-light: #2ecc71;
  --warning: #f39c12;
  --danger: #c0392b;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== 主容器 ========== */
.app { max-width: 800px; margin: 0 auto; padding: 20px 16px 40px; }

/* ========== 设置界面 ========== */
.setup-screen {
  background: var(--card);
  border-radius: var(--radius);
  padding: 40px 32px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: fadeIn 0.5s ease;
}

.setup-screen h1 {
  font-size: 28px;
  color: var(--primary);
  margin-bottom: 8px;
}

.setup-screen .subtitle {
  font-size: 15px;
  color: var(--text-light);
  margin-bottom: 32px;
}

.quiz-mode { margin-bottom: 24px; }

.quiz-mode h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: var(--text);
}

.mode-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.mode-btn {
  padding: 14px 20px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 140px;
}

.mode-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
.mode-btn.active {
  border-color: var(--primary);
  background: #fdf0ef;
  color: var(--primary);
}
.mode-btn .mode-icon { font-size: 24px; }
.mode-btn .mode-desc { font-size: 12px; color: var(--text-light); }

.count-section { margin: 24px 0; }
.count-section label { font-size: 16px; display: block; margin-bottom: 12px; }

.count-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.count-btn {
  padding: 10px 22px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.2s;
}
.count-btn:hover { border-color: var(--primary); }
.count-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }

.start-btn {
  margin-top: 28px;
  padding: 16px 48px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 16px rgba(231,76,60,0.35);
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(231,76,60,0.45); }
.start-btn:active { transform: translateY(0); }

.vocab-info {
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-light);
}

/* ========== 测验界面 ========== */
.quiz-screen { display: none; }
.quiz-screen.active { display: block; animation: fadeIn 0.4s ease; }

.quiz-header {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.progress-info { flex: 1; }
.progress-text { font-size: 14px; color: var(--text-light); margin-bottom: 6px; }
.progress-bar {
  height: 8px;
  background: #e8e8e8;
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}

.score-box {
  text-align: right;
  min-width: 80px;
}
.score-box .score-label { font-size: 12px; color: var(--text-light); }
.score-box .score-value { font-size: 22px; font-weight: 700; color: var(--success); }

/* ========== 题目卡片 ========== */
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.question-number {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 12px;
}

.question-content {
  text-align: center;
  padding: 20px 0;
}

.question-prompt {
  font-size: 15px;
  color: var(--text-light);
  margin-bottom: 16px;
}

.question-word {
  font-size: 48px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
}

.question-pinyin {
  font-size: 20px;
  color: var(--text-light);
  margin-bottom: 4px;
}

/* ========== 选项 ========== */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.option-btn {
  padding: 16px 20px;
  border: 2px solid #e8e8e8;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.25s;
  text-align: center;
  word-break: break-word;
  position: relative;
}

.option-btn:hover:not(.disabled) {
  border-color: var(--primary);
  background: #fdf8f7;
  transform: translateY(-1px);
}

.option-btn.disabled { cursor: not-allowed; }

.option-btn.correct {
  border-color: var(--success);
  background: #e8f8f0;
  color: var(--success);
  animation: pulseGreen 0.5s ease;
}

.option-btn.wrong {
  border-color: var(--danger);
  background: #fdeaea;
  color: var(--danger);
  animation: shake 0.4s ease;
}

.option-btn .option-label {
  position: absolute;
  top: -8px;
  left: 10px;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-light);
}

.option-btn.correct .option-label { border-color: var(--success); color: var(--success); background: #e8f8f0; }
.option-btn.wrong .option-label { border-color: var(--danger); color: var(--danger); background: #fdeaea; }

/* ========== 庆祝效果 ========== */
.celebration {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 1000;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0;
}

.celebration-active .confetti { animation: confettiFall 1.2s ease-out forwards; }

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
}

.star-burst {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0;
  pointer-events: none;
  z-index: 1001;
}

.star-burst.show { animation: starBurst 0.8s ease-out forwards; }

@keyframes starBurst {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
}

.encourage-text {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 32px;
  font-weight: 800;
  color: var(--success);
  pointer-events: none;
  z-index: 1002;
  opacity: 0;
}

.encourage-text.show { animation: encouragePop 1s ease-out forwards; }

@keyframes encouragePop {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.5); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); }
  80% { opacity: 1; transform: translateX(-50%) translateY(-10px) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(0.9); }
}

/* ========== 反馈区域 ========== */
.feedback {
  margin-top: 16px;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 15px;
  display: none;
  animation: fadeIn 0.3s ease;
}

.feedback.show { display: block; }
.feedback.correct { background: #e8f8f0; color: var(--success); border: 1px solid #d5f5e3; }
.feedback.wrong { background: #fdeaea; color: var(--danger); border: 1px solid #fadbd8; }
.feedback .correct-answer { font-weight: 600; margin-top: 4px; }

/* ========== 导航按钮 ========== */
.quiz-nav {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.nav-btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.25s;
}

.nav-btn.next {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
}
.nav-btn.next:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(231,76,60,0.3); }
.nav-btn.next:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.nav-btn.quit {
  background: #fff;
  color: var(--text-light);
  border: 2px solid #e0e0e0;
  flex: 0 0 100px;
}
.nav-btn.quit:hover { border-color: var(--danger); color: var(--danger); }

/* ========== 结果界面 ========== */
.result-screen { display: none; }
.result-screen.active { display: block; animation: fadeIn 0.5s ease; }

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 40px 32px;
  box-shadow: var(--shadow);
  text-align: center;
  margin-bottom: 20px;
}

.result-emoji { font-size: 56px; margin-bottom: 12px; }
.result-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.result-score {
  font-size: 48px;
  font-weight: 800;
  color: var(--primary);
  margin: 16px 0;
}
.result-score .total { font-size: 24px; color: var(--text-light); }

.result-stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 24px 0;
  flex-wrap: wrap;
}

.stat-item {
  padding: 16px 24px;
  border-radius: 12px;
  min-width: 100px;
}
.stat-item.correct-stat { background: #e8f8f0; }
.stat-item.wrong-stat { background: #fdeaea; }
.stat-item .stat-num { font-size: 28px; font-weight: 700; }
.stat-item .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }
.stat-item.correct-stat .stat-num { color: var(--success); }
.stat-item.wrong-stat .stat-num { color: var(--danger); }

.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
}

.result-btn {
  padding: 14px 28px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.25s;
}

.result-btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
}
.result-btn.secondary {
  background: #fff;
  color: var(--text);
  border: 2px solid #e0e0e0;
}
.result-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

/* ========== 错题表 ========== */
.error-list-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  display: none;
}
.error-list-section.show { display: block; animation: fadeIn 0.5s ease; }

.error-list-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.error-table-wrap { overflow-x: auto; }

.error-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.error-table th {
  background: #f8f9fa;
  padding: 12px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text-light);
  border-bottom: 2px solid #e8e8e8;
  white-space: nowrap;
}

.error-table td {
  padding: 12px 14px;
  border-bottom: 1px solid #f0f0f0;
}

.error-table tr:hover { background: #fafafa; }

.error-table .hanzi-cell { font-size: 18px; font-weight: 600; }
.error-table .pinyin-cell { color: var(--text-light); }
.error-table .your-answer { color: var(--danger); }
.error-table .correct-answer-cell { color: var(--success); font-weight: 500; }

.error-empty {
  text-align: center;
  padding: 32px;
  color: var(--text-light);
  font-size: 16px;
}

/* ========== 动画 ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGreen {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  .options { grid-template-columns: 1fr; }
  .question-word { font-size: 36px; }
  .mode-btn { min-width: 120px; }
}

/* ========== 单题模式全宽选项 ========== */
.single-column .options { grid-template-columns: 1fr; }
</style>
</head>
<body>

<div class="app">

<!-- ========== 设置界面 ========== -->
<div class="setup-screen" id="setupScreen">
  <h1>HSK词汇互动测验</h1>
  <p class="subtitle">初中三年级 · HSK 1-2级全词汇 · 检测你的掌握情况</p>

  <div class="quiz-mode">
    <h3>选择测验模式</h3>
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="thai">
        <span class="mode-icon">🇹🇭</span>
        <span>看中文选泰语</span>
        <span class="mode-desc">显示汉字，选择正确的泰语释义</span>
      </button>
      <button class="mode-btn" data-mode="hanzi">
        <span class="mode-icon">🇨🇳</span>
        <span>看泰语选中文</span>
        <span class="mode-desc">显示泰语释义，选择正确的汉字</span>
      </button>
      <button class="mode-btn" data-mode="pinyin">
        <span class="mode-icon">🔤</span>
        <span>看中文选拼音</span>
        <span class="mode-desc">显示汉字，选择正确的拼音</span>
      </button>
    </div>
  </div>

  <div class="count-section">
    <label>选择题目数量</label>
    <div class="count-buttons">
      <button class="count-btn" data-count="10">10题</button>
      <button class="count-btn" data-count="20">20题</button>
      <button class="count-btn active" data-count="30">30题</button>
      <button class="count-btn" data-count="50">50题</button>
    </div>
  </div>

  <button class="start-btn" id="startBtn">开始测验 🚀</button>
  <div class="vocab-info">题库共 499 个词汇 · 每题4个选项 · 答对有庆祝特效 · 自动记录错题</div>
</div>

<!-- ========== 测验界面 ========== -->
<div class="quiz-screen" id="quizScreen">
  <div class="quiz-header">
    <div class="progress-info">
      <div class="progress-text" id="progressText">第 1 / 30 题</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="score-box">
      <div class="score-label">得分</div>
      <div class="score-value" id="scoreValue">0</div>
    </div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="question-number" id="questionNumber">题目 1</div>
    <div class="question-content">
      <div class="question-prompt" id="questionPrompt">请选择正确的泰语释义</div>
      <div class="question-word" id="questionWord">—</div>
      <div class="question-pinyin" id="questionPinyin" style="display:none;"></div>
    </div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="quiz-nav">
      <button class="nav-btn quit" id="quitBtn">退出</button>
      <button class="nav-btn next" id="nextBtn" disabled>下一题 →</button>
    </div>
  </div>
</div>

<!-- ========== 结果界面 ========== -->
<div class="result-screen" id="resultScreen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">测验完成！</div>
    <div class="result-score"><span id="resultScore">0</span><span class="total"> / <span id="resultTotal">30</span></span></div>
    <div class="result-stats">
      <div class="stat-item correct-stat">
        <div class="stat-num" id="correctCount">0</div>
        <div class="stat-label">答对</div>
      </div>
      <div class="stat-item wrong-stat">
        <div class="stat-num" id="wrongCount">0</div>
        <div class="stat-label">答错</div>
      </div>
      <div class="stat-item" style="background:#e8eaf6;">
        <div class="stat-num" id="accuracyRate" style="color:#3f51b5;">0%</div>
        <div class="stat-label">正确率</div>
      </div>
    </div>
    <div class="result-actions">
      <button class="result-btn primary" id="retryBtn">再测一次</button>
      <button class="result-btn secondary" id="reviewBtn">查看错题表</button>
      <button class="result-btn secondary" id="restartBtn">返回设置</button>
    </div>
  </div>

  <!-- 错题表 -->
  <div class="error-list-section" id="errorListSection">
    <div class="error-list-title">📝 错题表</div>
    <div class="error-table-wrap" id="errorTableWrap"></div>
    <div style="margin-top:16px; text-align:center;">
      <button class="result-btn secondary" id="exportBtn">导出错题表 (CSV)</button>
    </div>
  </div>
</div>

</div>

<!-- 庆祝效果容器 -->
<div class="celebration" id="celebration"></div>
<div class="star-burst" id="starBurst"></div>
<div class="encourage-text" id="encourageText"></div>

const VOCAB = VOCAB_RAW.map(v => ({h: v[0], p: v[1], t: v[2]}));

// ========== 状态管理 ==========
let state = {
  mode: 'thai',        // 'thai' | 'hanzi' | 'pinyin'
  totalQuestions: 30,
  currentIndex: 0,
  score: 0,
  questions: [],
  answered: false,
  errorList: []
};

// ========== 工具函数 ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ========== 题目生成 ==========
function generateQuestions(mode, count) {
  const selected = pickRandom(VOCAB, count);
  return selected.map((word, i) => {
    // 干扰项：从词库中随机选取3个不同的词
    const distractors = VOCAB.filter(v => v.h !== word.h);
    const wrongOptions = pickRandom(distractors, 3);

    let questionWord, questionPinyin, correctAnswer, options;

    if (mode === 'thai') {
      // 显示汉字，选泰语
      questionWord = word.h;
      questionPinyin = '';
      correctAnswer = word.t;
      options = shuffle([word.t, ...wrongOptions.map(o => o.t)]);
    } else if (mode === 'hanzi') {
      // 显示泰语，选汉字
      questionWord = word.t;
      questionPinyin = '';
      correctAnswer = word.h;
      options = shuffle([word.h, ...wrongOptions.map(o => o.h)]);
    } else if (mode === 'pinyin') {
      // 显示汉字，选拼音
      questionWord = word.h;
      questionPinyin = word.t;  // 显示泰语作为提示
      correctAnswer = word.p;
      options = shuffle([word.p, ...wrongOptions.map(o => o.p)]);
    }

    return {
      index: i,
      word: word,
      questionWord: questionWord,
      questionPinyin: questionPinyin,
      correctAnswer: correctAnswer,
      options: options,
      userAnswer: null,
      isCorrect: false
    };
  });
}

// ========== 渲染题目 ==========
function renderQuestion() {
  const q = state.questions[state.currentIndex];
  state.answered = false;

  // 进度
  document.getElementById('progressText').textContent =
    `第 ${state.currentIndex + 1} / ${state.totalQuestions} 题`;
  document.getElementById('progressFill').style.width =
    `${((state.currentIndex) / state.totalQuestions) * 100}%`;
  document.getElementById('scoreValue').textContent = state.score;

  // 题目内容
  document.getElementById('questionNumber').textContent = `题目 ${state.currentIndex + 1}`;

  const promptMap = {
    'thai': '请选择正确的泰语释义',
    'hanzi': '请选择正确的中文汉字',
    'pinyin': '请选择正确的拼音'
  };
  document.getElementById('questionPrompt').textContent = promptMap[state.mode];

  document.getElementById('questionWord').textContent = q.questionWord;

  const pinyinEl = document.getElementById('questionPinyin');
  if (q.questionPinyin && state.mode === 'pinyin') {
    pinyinEl.textContent = q.questionPinyin;
    pinyinEl.style.display = 'block';
  } else {
    pinyinEl.style.display = 'none';
  }

  // 选项
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(opt, btn);
    container.appendChild(btn);
  });

  // 反馈区隐藏
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').disabled = true;
}

// ========== 选择答案 ==========
function selectAnswer(selectedOption, btnEl) {
  if (state.answered) return;
  state.answered = true;

  const q = state.questions[state.currentIndex];
  q.userAnswer = selectedOption;
  q.isCorrect = (selectedOption === q.correctAnswer);

  // 禁用所有选项
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.classList.add('disabled'));

  // 标记正确和错误
  allBtns.forEach(b => {
    const text = b.textContent.replace(/^[A-D]/, '').trim();
    if (text === q.correctAnswer) {
      b.classList.add('correct');
    } else if (b === btnEl && !q.isCorrect) {
      b.classList.add('wrong');
    }
  });

  // 反馈
  const feedback = document.getElementById('feedback');
  if (q.isCorrect) {
    state.score++;
    document.getElementById('scoreValue').textContent = state.score;
    feedback.className = 'feedback show correct';
    feedback.innerHTML = '✅ 回答正确！';
    triggerCelebration();
  } else {
    feedback.className = 'feedback show wrong';
    let correctDisplay = q.correctAnswer;
    if (state.mode === 'hanzi') {
      const correctWord = VOCAB.find(v => v.h === q.correctAnswer);
      if (correctWord) correctDisplay = `${q.correctAnswer} (${correctWord.p})`;
    }
    feedback.innerHTML = `❌ 回答错误<div class="correct-answer">正确答案：${correctDisplay}</div>`;
    // 记录错题
    state.errorList.push({
      questionNum: state.currentIndex + 1,
      word: q.word,
      mode: state.mode,
      userAnswer: selectedOption,
      correctAnswer: q.correctAnswer
    });
  }

  // 启用下一题按钮
  document.getElementById('nextBtn').disabled = false;
}

const encourageWords = ['太棒了！', '答对了！', '厉害！', '完美！', '继续加油！', '好样的！'];
const confettiColors = ['#e74c3c', '#f39c12', '#27ae60', '#2980b9', '#9b59b6', '#1abc9c'];

function triggerCelebration() {
  // 彩纸效果
  const celebration = document.getElementById('celebration');
  celebration.className = 'celebration celebration-active';
  celebration.innerHTML = '';

  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = Math.random() * 20 + '%';
    confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    confetti.style.width = (6 + Math.random() * 8) + 'px';
    confetti.style.height = (6 + Math.random() * 8) + 'px';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.animationDelay = Math.random() * 0.3 + 's';
    confetti.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    celebration.appendChild(confetti);
  }

  setTimeout(() => { celebration.className = 'celebration'; celebration.innerHTML = ''; }, 1500);

  // 鼓励文字
  const encourageEl = document.getElementById('encourageText');
  encourageEl.textContent = encourageWords[Math.floor(Math.random() * encourageWords.length)];
  encourageEl.classList.remove('show');
  void encourageEl.offsetWidth;
  encourageEl.classList.add('show');
  setTimeout(() => { encourageEl.classList.remove('show'); }, 1000);
}

// ========== 下一题 ==========
function nextQuestion() {
  if (state.currentIndex < state.totalQuestions - 1) {
    state.currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

// ========== 显示结果 ==========
function showResults() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');

  const correct = state.score;
  const wrong = state.totalQuestions - correct;
  const accuracy = Math.round((correct / state.totalQuestions) * 100);

  document.getElementById('resultScore').textContent = correct;
  document.getElementById('resultTotal').textContent = state.totalQuestions;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('accuracyRate').textContent = accuracy + '%';

  // 根据成绩显示不同表情和标题
  let emoji, title;
  if (accuracy >= 90) { emoji = '🏆'; title = '太厉害了！'; }
  else if (accuracy >= 75) { emoji = '🎉'; title = '做得不错！'; }
  else if (accuracy >= 60) { emoji = '👍'; title = '继续努力！'; }
  else { emoji = '💪'; title = '加油，多练习！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;

  // 渲染错题表
  renderErrorList();
}

// ========== 渲染错题表 ==========
function renderErrorList() {
  const wrap = document.getElementById('errorTableWrap');
  const section = document.getElementById('errorListSection');

  if (state.errorList.length === 0) {
    wrap.innerHTML = '<div class="error-empty">🎉 没有错题，全部答对了！</div>';
    section.classList.add('show');
    return;
  }

  const modeLabels = {
    'thai': '看中文选泰语',
    'hanzi': '看泰语选中文',
    'pinyin': '看中文选拼音'
  };

  let html = '<table class="error-table"><thead><tr>';
  html += '<th>序号</th><th>汉字</th><th>拼音</th><th>泰语释义</th><th>你的答案</th><th>正确答案</th><th>题型</th>';
  html += '</tr></thead><tbody>';

  state.errorList.forEach((err, i) => {
    const w = err.word;
    html += '<tr>';
    html += `<td>${i + 1}</td>`;
    html += `<td class="hanzi-cell">${w.h}</td>`;
    html += `<td class="pinyin-cell">${w.p}</td>`;
    html += `<td>${w.t}</td>`;
    html += `<td class="your-answer">${err.userAnswer}</td>`;
    html += `<td class="correct-answer-cell">${err.correctAnswer}</td>`;
    html += `<td>${modeLabels[err.mode]}</td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
  section.classList.add('show');
}

// ========== 导出错题表CSV ==========
function exportErrorCSV() {
  if (state.errorList.length === 0) {
    alert('没有错题可导出！');
    return;
  }

  const modeLabels = {
    'thai': '看中文选泰语',
    'hanzi': '看泰语选中文',
    'pinyin': '看中文选拼音'
  };

  let csv = '\uFEFF序号,汉字,拼音,泰语释义,你的答案,正确答案,题型\n';
  state.errorList.forEach((err, i) => {
    const w = err.word;
    const row = [
      i + 1,
      w.h,
      w.p,
      '"' + w.t.replace(/"/g, '""') + '"',
      '"' + err.userAnswer.replace(/"/g, '""') + '"',
      '"' + err.correctAnswer.replace(/"/g, '""') + '"',
      modeLabels[err.mode]
    ];
    csv += row.join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `HSK错题表_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
}

// ========== 开始测验 ==========
function startQuiz() {
  state.questions = generateQuestions(state.mode, state.totalQuestions);
  state.currentIndex = 0;
  state.score = 0;
  state.errorList = [];

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('errorListSection').classList.remove('show');
  document.getElementById('quizScreen').classList.add('active');

  renderQuestion();
}

// ========== 重置到设置界面 ==========
function backToSetup() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('errorListSection').classList.remove('show');
  document.getElementById('setupScreen').style.display = 'block';
}

// ========== 事件绑定 ==========
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
  };
});

document.querySelectorAll('.count-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.totalQuestions = parseInt(btn.dataset.count);
  };
});

document.getElementById('startBtn').onclick = startQuiz;
document.getElementById('nextBtn').onclick = nextQuestion;
document.getElementById('quitBtn').onclick = () => {
  if (confirm('确定要退出当前测验吗？')) backToSetup();
};
document.getElementById('retryBtn').onclick = startQuiz;
document.getElementById('restartBtn').onclick = backToSetup;
document.getElementById('reviewBtn').onclick = () => {
  document.getElementById('errorListSection').scrollIntoView({ behavior: 'smooth' });
};
document.getElementById('exportBtn').onclick = exportErrorCSV;

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('quizScreen').classList.contains('active')) return;
  if (state.answered) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!document.getElementById('nextBtn').disabled) nextQuestion();
    }
    return;
  }
  const keyMap = { '1': 0, 'a': 0, 'A': 0, '2': 1, 'b': 1, 'B': 1, '3': 2, 'c': 2, 'C': 2, '4': 3, 'd': 3, 'D': 3 };
  if (e.key in keyMap) {
    const btns = document.querySelectorAll('.option-btn');
    if (btns[keyMap[e.key]]) btns[keyMap[e.key]].click();
  }
});
</script>
